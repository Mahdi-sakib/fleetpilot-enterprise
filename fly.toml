app = "fleetpilot-mahdisakib-api"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "4000"
  CLIENT_URL = "https://vms.mahdisakib.com"
  DB_PATH = "/app/data/fleetpilot.db"
  UPLOADS_DIR = "/app/data/uploads"

[[mounts]]
  source = "fleetpilot_data"
  destination = "/app/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
